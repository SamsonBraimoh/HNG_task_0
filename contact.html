<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="height: 100vh;">
    <!-- <article> -->
        <main class="contactMain">
            <nav class="contactnav">
                <a href="./index.html"><button class="aboutBtn">Home</button></a>
                <a href="./about.html"><button class="aboutBtn">About</button></a>
            </nav>
            <h2 class="contactHeading">Send a message</h2>
            <form action="" class="contactForm" id="contactForm" novalidategit>
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="e.g, Samson Braimoh" autocomplete="name" aria-describedby="nameError" data-testid = "test-contact-name">
                
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="e.g, example@gmail.com" autocomplete="email" aria-describedby="emailError" data-testid = "test-contact-email">
                
                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="subject" autocomplete="off" aria-describedby="subject" data-testid = "test-contact-subject">
               
                <label for="message">Message</label>
                <textarea name="" id="message" data-testid = "test-contact-message"></textarea>
                
                <button class="formSubmitButton" type="submit">Submit</button>
            </form>
            <p id="errorMessage" data-testid="test-contact-error-email" style="font-style: italic; color: red;"></p>
            <p id="success" data-testid="test-contact-success" style="font-style: italic;"></p>
        </main>
    <!-- </article> -->
    <script src="contact.js"></script>
</body>
</html>
